spring.application.name=autoloc-api
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

server.servlet.context-path=/auto-loc

server.port=8081

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.urls-primary-name=Agence
springdoc.group-configs[0].group=Agence
springdoc.group-configs[0].paths-to-match=/agences/**

springdoc.group-configs[1].group=Client
springdoc.group-configs[1].paths-to-match=/clients/**

springdoc.group-configs[2].group=Vehicule
springdoc.group-configs[2].paths-to-match=/vehicules/**

springdoc.group-configs[3].group=Employe
springdoc.group-configs[3].paths-to-match=/employes/**

springdoc.group-configs[4].group=Equipement
springdoc.group-configs[4].paths-to-match=/equipements/**

springdoc.group-configs[5].group=Reservation
springdoc.group-configs[5].paths-to-match=/reservations/**

springdoc.group-configs[6].group=Contrat
springdoc.group-configs[6].paths-to-match=/contrats/**

springdoc.group-configs[7].group=Paiement
springdoc.group-configs[7].paths-to-match=/paiements/**

springdoc.group-configs[8].group=Maintenance
springdoc.group-configs[8].paths-to-match=/maintenances/**

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always